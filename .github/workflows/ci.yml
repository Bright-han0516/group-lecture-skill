name: demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TeX Live and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-chinese \
            texlive-fonts-recommended lmodern poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check template copies are in sync
        run: |
          diff template/jt_lecture.tex examples/demo/_模板/jt_lecture.tex
          diff template/jt_topic.tex examples/demo/_模板/jt_topic.tex

      - name: Compile scripts
        run: |
          python -m py_compile scripts/*.py
          bash -n scripts/build_topic.sh
          bash -n bootstrap.sh

      - name: Cross-project installer and board smoke test
        run: |
          bash -n install.sh
          bash install.sh --hosts codex
          test -L "$HOME/.agents/skills/group-lecture-builder"
          test -f "$HOME/.agents/skills/group-lecture-builder/SKILL.md"
          bash install.sh --hosts codex
          tmp="$(mktemp -d)"
          python scripts/scaffold_topic.py --board CIE --root "$tmp/another-project" 3.1 Motion "Kinematics"
          test "$(cat "$tmp/another-project/31_Motion/.glb-board")" = "CIE"
          (cd "$tmp/another-project/31_Motion/src" && ./build.sh)
          test -f "$tmp/another-project/31_Motion/dist/CIE_31_Motion_GroupLecture_Student.pdf"
          test -f "$tmp/another-project/31_Motion/dist/CIE_31_Motion_GroupLecture_Key.pdf"
          python scripts/check_topic.py "$tmp/another-project/31_Motion"
          rm -rf "$tmp"

      - name: Bootstrap (preflight + demo + QA)
        run: ./bootstrap.sh

      - name: Upload demo PDFs
        uses: actions/upload-artifact@v4
        with:
          name: demo-pdfs
          path: |
            examples/demo/Demo_Topic/dist/*.pdf
            examples/demo/Demo_Topic/qa/build/*.log
